<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>留言板</title>
<meta name="description" content="一个干净的在线留言板。写下你想说的，留在这面墙上。">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M8 11h16M8 16h11' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=1.0.0">
<script>
  try {
    var t = localStorage.getItem('notewall:theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h11M4 18h7"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>留言板</h1>
          <span>NOTE WALL</span>
        </div>
      </div>

      <div class="header-right">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input id="search" type="search" placeholder="搜索留言或昵称…" autocomplete="off" aria-label="搜索留言">
        </label>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="切换主题" title="切换主题">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- 发布区 -->
    <section class="composer" aria-labelledby="composer-title">
      <h2 id="composer-title" class="sr-only">写留言</h2>
      <form id="form" novalidate>
        <div class="composer-top">
          <div class="composer-avatar" id="preview-avatar" aria-hidden="true">匿</div>
          <div class="composer-fields">
            <input
              id="nickname"
              class="nick-input"
              type="text"
              maxlength="16"
              placeholder="昵称（可留空，默认「匿名」）"
              autocomplete="nickname"
            >
            <div class="composer-meta">
              <span id="hint" class="hint">说点什么吧，写下的内容只会保存在这台设备的浏览器里。</span>
            </div>
          </div>
        </div>

        <div class="composer-body">
          <textarea id="content" rows="4" maxlength="500" placeholder="写下你想说的话…" aria-label="留言内容"></textarea>
          <div class="counter"><span id="count">0</span> / 500</div>
        </div>

        <div class="composer-foot">
          <div class="composer-tools">
            <span class="dot" id="status-dot"></span>
            <span id="status-text" class="status-text">未发布</span>
          </div>
          <div class="composer-actions">
            <button type="button" id="clear-btn" class="btn btn-ghost">清空</button>
            <button type="submit" id="submit-btn" class="btn btn-primary">
              发布留言
              <kbd>Ctrl ↵</kbd>
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="tabs" role="tablist" aria-label="排序方式">
          <button class="tab active" data-sort="new" role="tab" aria-selected="true">最新</button>
          <button class="tab" data-sort="hot" role="tab" aria-selected="false">最热</button>
        </div>
        <span class="sep" aria-hidden="true"></span>
        <span id="count-label" class="count-label">共 0 条留言</span>
      </div>
      <button id="more-btn" class="btn btn-ghost btn-sm" hidden>加载更多</button>
    </div>

    <!-- 列表 -->
    <section id="list" class="list" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="10" y="14" width="44" height="34" rx="6"/>
          <path d="M10 24h44M20 34h12M20 41h20"/>
        </svg>
      </div>
      <p id="empty-text">还没有留言，成为第一个写下的人吧。</p>
    </div>

    <footer class="foot">
      <span>留言板 · 纯前端实现，数据保存在本地浏览器</span>
      <button id="export-btn" class="link-btn">导出数据</button>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=1.0.0"></script>
</body>
</html>
